# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy container app to Azure Web App - TinyLink
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true  
  
on:
  push:
    branches:
      - dev
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.REGISTRY }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSWORD }}

      - name: Build and push container image to registry
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: '${{ secrets.REGISTRY }}/tinylink:${{ github.sha }}'
          file: ./Dockerfile

  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    needs: build
    
    steps:
      - name: Debug secrets          # ← ADD HERE
        run: |
          echo "Client ID length: ${#CLIENT_ID}."
          echo "Tenant ID length: ${#TENANT_ID}."
          echo "Subscription ID length: ${#SUB_ID}."
          echo "Client ID starts with: ${CLIENT_ID:0:4}..."
          echo "Tenant ID starts with: ${TENANT_ID:0:4}..."
          echo "Subscription ID starts with: ${SUB_ID:0:4}..."
        env:
          CLIENT_ID: ${{ secrets.CLIENTID }}
          TENANT_ID: ${{ secrets.TENANTID }}
          SUB_ID: ${{ secrets.SUBSCRIPTIONID }}
      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v2
        with:
          app-name: 'TinyLink'
          slot-name: 'Production'
          images: '${{ secrets.REGISTRY }}/tinylink:${{ github.sha }}'
